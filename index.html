AD6C\uD569\uB2C8\uB2E4.","What I bring":"\uC81C\uAC00 \uC798\uD558\uB294 \uC77C","I ask questions until I understand the structure, turn assumptions into checks, and learn from the gap between expected and actual behavior.":"\uC9C8\uBB38\uD558\uBA70 \uAD6C\uC870\uB97C \uC774\uD574\uD558\uACE0, \uAC00\uC815\uC744 \uAC80\uC99D\uD560 \uBC29\uBC95\uC744 \uCC3E\uC2B5\uB2C8\uB2E4. \uAE30\uB300\uD55C \uB3D9\uC791\uACFC \uC2E4\uC81C \uB3D9\uC791\uC758 \uCC28\uC774\uC5D0\uC11C \uB2E4\uC74C\uC5D0 \uD560 \uC77C\uC744 \uCC3E\uC2B5\uB2C8\uB2E4.","What I am building":"\uC9C0\uAE08 \uB9CC\uB4DC\uB294 \uAC83","Agent workflows and developer tools that connect ideas, tasks, execution environments and human review.":"\uC544\uC774\uB514\uC5B4\uC640 \uC791\uC5C5, \uC2E4\uD589 \uD658\uACBD, \uC0AC\uB78C\uC758 \uAC80\uD1A0\uB97C \uC5F0\uACB0\uD558\uB294 \uC5D0\uC774\uC804\uD2B8 \uC791\uC5C5 \uD750\uB984\uACFC \uAC1C\uBC1C \uB3C4\uAD6C\uB97C \uB9CC\uB4E4\uACE0 \uC788\uC2B5\uB2C8\uB2E4.","What I care about":"\uCD94\uAD6C\uD558\uB294 \uBC29\uD5A5","Useful tools that more people can try and shape together. I welcome conversations, feedback and opportunities to build with others.":"\uB354 \uB9CE\uC740 \uC0AC\uB78C\uC774 \uC368 \uBCF4\uACE0 \uD568\uAED8 \uAC1C\uC120\uD560 \uC218 \uC788\uB294 \uB3C4\uAD6C\uB97C \uB9CC\uB4E4\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4. \uB300\uD654\uC640 \uD53C\uB4DC\uBC31, \uD568\uAED8 \uB9CC\uB4DC\uB294 \uAE30\uD68C\uB97C \uD658\uC601\uD569\uB2C8\uB2E4.","Say hello":"\uC774\uC57C\uAE30 \uB098\uB204\uAE30","More from my workbench":"\uADF8 \uBC16\uC758 \uD504\uB85C\uC81D\uD2B8\uC640 \uD0D0\uC0C9 \uAE30\uB85D","A wider notebook of prototypes, local changes, coursework and research. These are at different stages; they are not all released products.":"\uD504\uB85C\uD1A0\uD0C0\uC785\uACFC \uB85C\uCEEC \uC218\uC815, \uC218\uC5C5 \uD504\uB85C\uC81D\uD2B8, \uC870\uC0AC \uAE30\uB85D\uB3C4 \uD568\uAED8 \uBAA8\uC558\uC2B5\uB2C8\uB2E4. \uC9C4\uD589 \uB2E8\uACC4\uAC00 \uC11C\uB85C \uB2E4\uB974\uBA70, \uBAA8\uB450 \uCD9C\uC2DC\uD55C \uC81C\uD488\uC740 \uC544\uB2D9\uB2C8\uB2E4.","A Markdown-first personal workspace with web and macOS views, backups and conflict checks. Native integration is still partial.":"Markdown\uC744 \uC6D0\uBCF8\uC73C\uB85C \uB450\uACE0 \uC6F9\xB7macOS \uD654\uBA74, \uBC31\uC5C5\uACFC \uCDA9\uB3CC \uAC80\uC0AC\uB97C \uC5F0\uACB0\uD558\uB294 \uAC1C\uC778 \uC791\uC5C5 \uACF5\uAC04\uC785\uB2C8\uB2E4. \uB124\uC774\uD2F0\uBE0C \uAE30\uB2A5\uC740 \uC77C\uBD80\uAE4C\uC9C0 \uC5F0\uACB0\uD588\uC2B5\uB2C8\uB2E4.","A LangGraph runner with checkpoints, review and human approval. Some provider integrations are exercised; the click-through demo remains separate from the runner.":"\uCCB4\uD06C\uD3EC\uC778\uD2B8\uC640 \uAC80\uD1A0, \uC0AC\uB78C\uC758 \uC2B9\uC778\uC744 \uC5F0\uACB0\uD55C LangGraph \uC2E4\uD589\uAE30\uC785\uB2C8\uB2E4. \uC77C\uBD80 \uC81C\uACF5\uC790 \uC5F0\uB3D9\uC744 \uD655\uC778\uD588\uC73C\uBA70, \uD074\uB9AD \uB370\uBAA8\uB294 \uC2E4\uC81C \uC2E4\uD589\uAE30\uC640 \uBCC4\uB3C4\uC785\uB2C8\uB2E4.","Local Rust changes around keyboard input, session forks, handoffs and project-path recovery. These are local modifications, without an upstream merge.":"\uD0A4\uBCF4\uB4DC \uC785\uB825, \uC138\uC158 \uBD84\uAE30\xB7\uC778\uACC4, \uD504\uB85C\uC81D\uD2B8 \uACBD\uB85C \uBCF5\uAD6C\uB97C \uB2E4\uB8EC Rust \uB85C\uCEEC \uC218\uC815\uC785\uB2C8\uB2E4. \uC6D0\uBCF8 \uD504\uB85C\uC81D\uD2B8\uC5D0 \uBCD1\uD569\uB41C \uC791\uC5C5\uC740 \uC544\uB2D9\uB2C8\uB2E4.","Trading-service and Rust backtesting research in paper mode. The work has not established a stable profitability advantage.":"\uBAA8\uC758 \uAC70\uB798 \uB2E8\uACC4\uC5D0\uC11C \uC11C\uBE44\uC2A4 \uAD6C\uC870\uC640 Rust \uBC31\uD14C\uC2A4\uD2B8\uB97C \uC5F0\uAD6C\uD55C \uC791\uC5C5\uC785\uB2C8\uB2E4. \uC548\uC815\uC801\uC778 \uC218\uC775 \uC6B0\uC704\uB294 \uD655\uC778\uD558\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4.","A Python CLI and offline dashboard for CSV exploration and experiment records. Validation uses synthetic fixtures.":"CSV \uD0D0\uC0C9\uACFC \uC2E4\uD5D8 \uAE30\uB85D\uC744 \uC5F0\uACB0\uD558\uB294 Python CLI\xB7\uC624\uD504\uB77C\uC778 \uB300\uC2DC\uBCF4\uB4DC\uC785\uB2C8\uB2E4. \uD569\uC131 \uB370\uC774\uD130\uB85C \uAE30\uB2A5\uC744 \uAC80\uC99D\uD55C \uB2E8\uACC4\uC785\uB2C8\uB2E4.","Rule and evidence-retrieval experiments with a mock submission flow. Model-level performance remains unmeasured.":"\uADDC\uCE59 \uAC80\uC0AC\uC640 \uADFC\uAC70 \uAC80\uC0C9\uC744 \uC2E4\uD5D8\uD558\uACE0 \uBAA8\uC758 \uC81C\uCD9C \uD750\uB984\uC744 \uD655\uC778\uD55C \uC791\uC5C5\uC785\uB2C8\uB2E4. \uBAA8\uB378 \uC131\uB2A5\uC740 \uC544\uC9C1 \uCE21\uC815\uD558\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4.","Policy and event compilation, validation traces and submission records. Results belong to their specific recorded versions.":"\uC815\uCC45\xB7\uC774\uBCA4\uD2B8 \uCEF4\uD30C\uC77C\uACFC \uAC80\uC99D \uCD94\uC801, \uC81C\uCD9C \uC774\uB825\uC744 \uB2E4\uB8EC \uB300\uD68C \uC791\uC5C5\uC785\uB2C8\uB2E4. \uACB0\uACFC\uB294 \uAE30\uB85D\uB41C \uAC01 \uBC84\uC804\uC758 \uC870\uAC74\uC5D0 \uB9DE\uCDB0 \uD574\uC11D\uD569\uB2C8\uB2E4.","Sensor aggregation, tree-model experiments, OOF validation, calibration and fusion. Some historical artifacts remain incomplete.":"\uC13C\uC11C \uC9D1\uACC4, \uD2B8\uB9AC \uBAA8\uB378, OOF \uAC80\uC99D\uACFC \uBCF4\uC815\xB7\uACB0\uD569\uC744 \uC2E4\uD5D8\uD588\uC2B5\uB2C8\uB2E4. \uACFC\uAC70 \uC0B0\uCD9C\uBB3C \uC911 \uC77C\uBD80\uB294 \uC544\uC9C1 \uCDA9\uBD84\uD788 \uC815\uB9AC\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4.","A team web project using React, Express and PostgreSQL. This coursework is separate from my UNCG research internship.":"React\xB7Express\xB7PostgreSQL\uC744 \uC0AC\uC6A9\uD55C \uD300 \uC6F9 \uD504\uB85C\uC81D\uD2B8\uC785\uB2C8\uB2E4. UNCG \uC5F0\uAD6C\uC2E4 \uC778\uD134\uACFC\uB294 \uBCC4\uB3C4\uB85C \uC9C4\uD589\uD55C \uC218\uC5C5 \uACFC\uC81C\uC785\uB2C8\uB2E4.","A local ledger prototype separating transactions from interpretation, with refund, cancellation and transfer handling on synthetic data.":"\uAC70\uB798 \uAE30\uB85D\uACFC \uD574\uC11D\uC744 \uBD84\uB9AC\uD558\uACE0, \uD569\uC131 \uB370\uC774\uD130\uB85C \uD658\uBD88\xB7\uCDE8\uC18C\xB7\uC774\uCCB4 \uCC98\uB9AC\uB97C \uD655\uC778\uD55C \uB85C\uCEEC \uC7A5\uBD80 \uD504\uB85C\uD1A0\uD0C0\uC785\uC785\uB2C8\uB2E4.","An artifact-inspection notebook covering binary resources and reference checks. It does not reconstruct the complete application source.":"\uBC14\uC774\uB108\uB9AC \uB9AC\uC18C\uC2A4\uC640 \uCC38\uC870 \uC815\uBCF4\uB97C \uB300\uC870\uD55C \uC815\uC801 \uBD84\uC11D \uAE30\uB85D\uC785\uB2C8\uB2E4. \uC571\uC758 \uC804\uCCB4 \uC18C\uC2A4 \uCF54\uB4DC\uB97C \uBCF5\uC6D0\uD55C \uACB0\uACFC\uB294 \uC544\uB2D9\uB2C8\uB2E4.","Experiments connecting custom skills, search and reverse-engineering tools. Connection checks and individual tool validation are tracked separately.":"\uC9C1\uC811 \uAD6C\uC131\uD55C \uC2A4\uD0AC\uACFC \uAC80\uC0C9\xB7\uB9AC\uBC84\uC2A4 \uC5D4\uC9C0\uB2C8\uC5B4\uB9C1 \uB3C4\uAD6C\uB97C \uC5F0\uACB0\uD55C \uC791\uC5C5\uC785\uB2C8\uB2E4. \uC5F0\uACB0 \uC131\uACF5\uACFC \uAC1C\uBCC4 \uB3C4\uAD6C\uC758 \uAC80\uC99D \uACB0\uACFC\uB97C \uB530\uB85C \uAE30\uB85D\uD569\uB2C8\uB2E4.","A learning interface and public-data loader scaffold. The planned analysis stages are still unfinished.":"\uD559\uC2B5 \uD654\uBA74\uACFC \uACF5\uAC1C \uB370\uC774\uD130 \uB85C\uB354\uC758 \uAE30\uCD08 \uAD6C\uC870\uB97C \uB9CC\uB4E0 \uC791\uC5C5\uC785\uB2C8\uB2E4. \uACC4\uD68D\uD55C \uBD84\uC11D \uB2E8\uACC4\uB294 \uC544\uC9C1 \uAD6C\uD604 \uC911\uC785\uB2C8\uB2E4.","Literature and design notes on integer, event-driven and growing neural graphs. No trained model or measured result yet.":"\uC815\uC218 \uC5F0\uC0B0, \uC774\uBCA4\uD2B8 \uAE30\uBC18 \uCC98\uB9AC, \uC131\uC7A5\uD615 \uC2E0\uACBD \uADF8\uB798\uD504\uC5D0 \uAD00\uD55C \uBB38\uD5CC \uC870\uC0AC\uC640 \uC124\uACC4 \uAE30\uB85D\uC785\uB2C8\uB2E4. \uD559\uC2B5\uD55C \uBAA8\uB378\uC774\uB098 \uCE21\uC815 \uACB0\uACFC\uB294 \uC544\uC9C1 \uC5C6\uC2B5\uB2C8\uB2E4.","Platform, SDK and competition-rule research. Preparation has not yet become an implemented application.":"\uD50C\uB7AB\uD3FC\xB7SDK\xB7\uB300\uD68C \uADDC\uC815\uC744 \uC870\uC0AC\uD55C \uC900\uBE44 \uAE30\uB85D\uC785\uB2C8\uB2E4. \uC571 \uAD6C\uD604\uAE4C\uC9C0 \uC9C4\uD589\uD55C \uC791\uC5C5\uC740 \uC544\uB2D9\uB2C8\uB2E4.","Debugger integration checks and editor-routing architecture notes. This remains environment and design work.":"\uB514\uBC84\uAC70 \uC5F0\uB3D9\uC744 \uD655\uC778\uD558\uACE0 \uC5D0\uB514\uD130 \uB77C\uC6B0\uD305 \uAD6C\uC870\uB97C \uC124\uACC4\uD55C \uAE30\uB85D\uC785\uB2C8\uB2E4. \uAC1C\uBC1C \uD658\uACBD \uD655\uC778\uACFC \uC124\uACC4 \uB2E8\uACC4\uC758 \uC791\uC5C5\uC785\uB2C8\uB2E4.","A mock integration exercise for state, cancellation, retries and confirmation. ASR, LLM and TTS are simulated; hands-on learning is still in progress.":"\uC0C1\uD0DC\xB7\uCDE8\uC18C\xB7\uC7AC\uC2DC\uB3C4\xB7\uD655\uC778 \uB2E8\uACC4\uB97C \uC0B4\uD3B4\uBCF4\uB294 \uBAA8\uC758 \uC5F0\uB3D9 \uC2E4\uC2B5\uC785\uB2C8\uB2E4. ASR\xB7LLM\xB7TTS\uB294 mock\uC774\uBA70, \uC9C1\uC811 \uB3D9\uC791\uC744 \uC775\uD788\uB294 \uC2E4\uC2B5\uC740 \uC9C4\uD589 \uC911\uC785\uB2C8\uB2E4.","TOOLS \u2192 CONFIG \u2192 ENVIRONMENT":"\uB3C4\uAD6C \u2192 \uC124\uC815 \u2192 \uC2E4\uD589 \uD658\uACBD","JEV \u2192 DAG \u2192 WORKERS":"JEV \u2192 DAG \u2192 \uC5D0\uC774\uC804\uD2B8","IMAGE \u2192 FEATURES \u2192 EVALUATION":"\uC774\uBBF8\uC9C0 \u2192 \uD2B9\uC9D5 \u2192 \uD3C9\uAC00","DATA \u2192 ANALYSIS \u2192 SERVICE":"\uB370\uC774\uD130 \u2192 \uBD84\uC11D \u2192 \uC11C\uBE44\uC2A4","ONNX \u2192 MAPPING \u2192 CONFIG":"ONNX \u2192 \uB9E4\uD551 \u2192 \uC124\uC815","Backend & AI Systems":"\uBC31\uC5D4\uB4DC \xB7 AI \uC2DC\uC2A4\uD15C","A software engineer who likes to understand the problem, build with AI, and check what actually changed.":"\uBB38\uC81C\uB97C \uC774\uD574\uD558\uACE0 AI\uC640 \uD568\uAED8 \uAD6C\uD604\uD558\uBA70, \uC2E4\uC81C\uB85C \uBB34\uC5C7\uC774 \uB2EC\uB77C\uC84C\uB294\uC9C0 \uD655\uC778\uD558\uB294 \uC18C\uD504\uD2B8\uC6E8\uC5B4 \uC5D4\uC9C0\uB2C8\uC5B4\uC785\uB2C8\uB2E4.",ENGINEERING:"\uAC1C\uBC1C \uACBD\uD5D8","Backend systems & QA":"\uBC31\uC5D4\uB4DC \uC2DC\uC2A4\uD15C \xB7 QA",EXPLORATION:"\uD0D0\uAD6C \uBD84\uC57C","Agents & applied ML":"\uC5D0\uC774\uC804\uD2B8 \xB7 \uBA38\uC2E0\uB7EC\uB2DD","WORKING STYLE":"\uC77C\uD558\uB294 \uBC29\uC2DD","AI-assisted. Human-reviewed.":"AI\uC640 \uAD6C\uD604\uD558\uACE0, \uC9C1\uC811 \uAC80\uD1A0\uD569\uB2C8\uB2E4.","Case studies":"\uD504\uB85C\uC81D\uD2B8 \uAE30\uB85D","COLOR THEME":"\uC0C9\uC0C1 \uD14C\uB9C8",Dark:"\uB2E4\uD06C",Light:"\uB77C\uC774\uD2B8","IDEAS \u2192 EXPERIMENTS \u2192 EVIDENCE":"\uC544\uC774\uB514\uC5B4 \u2192 \uC2E4\uD5D8 \u2192 \uADFC\uAC70","Portfolio sections":"\uD3EC\uD2B8\uD3F4\uB9AC\uC624 \uBA54\uB274",Overview:"\uC18C\uAC1C",Work:"\uD504\uB85C\uC81D\uD2B8",Experience:"\uACBD\uB825",Background:"\uD559\uB825\xB7\uD65C\uB3D9",Notes:"\uD68C\uACE0","A LITTLE ABOUT ME":"\uC800\uB97C \uC18C\uAC1C\uD569\uB2C8\uB2E4","Portfolio / 2026":"\uD3EC\uD2B8\uD3F4\uB9AC\uC624 / 2026","I build systems,":"\uC2DC\uC2A4\uD15C\uC744 \uB9CC\uB4E4\uACE0,","then test the assumptions.":"\uADF8 \uC548\uC758 \uAC00\uC815\uC744 \uAC80\uC99D\uD569\uB2C8\uB2E4.","My work spans backend engineering, QA and AI competitions. I enter competitions to see how AI performs in practice and learn from other builders. Today I am exploring how models, tools and agents can work together, and how to make that setup easier to use. I want to connect that learning to real industry problems.":"\uBC31\uC5D4\uB4DC \uAC1C\uBC1C\uACFC QA\uB97C \uACBD\uD5D8\uD588\uACE0, AI\uB97C \uC2E4\uC81C\uB85C \uC5B4\uB514\uAE4C\uC9C0 \uD65C\uC6A9\uD560 \uC218 \uC788\uB294\uC9C0 \uD655\uC778\uD558\uB824\uACE0 \uC5EC\uB7EC \uB300\uD68C\uC5D0 \uCC38\uAC00\uD588\uC2B5\uB2C8\uB2E4. \uC9C0\uAE08\uC740 \uBAA8\uB378\xB7\uB3C4\uAD6C\xB7\uC5D0\uC774\uC804\uD2B8\uAC00 \uD568\uAED8 \uC77C\uD558\uB294 \uAD6C\uC870\uC640, \uADF8 \uD658\uACBD\uC744 \uB354 \uC27D\uAC8C \uC5F0\uACB0\uD558\uB294 \uBC29\uBC95\uC744 \uD0D0\uAD6C\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uC774 \uACBD\uD5D8\uC744 \uC2E4\uC81C \uC0B0\uC5C5\uC758 \uBB38\uC81C\uB85C \uC774\uC5B4\uAC00\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.","Read my latest reflection":"\uCD5C\uADFC \uD68C\uACE0 \uC77D\uAE30","PERSONAL REFLECTION":"\uAC1C\uC778 \uD68C\uACE0","25 October 2026":"2026\uB144 10\uC6D4 25\uC77C","From trying AI tools to making them work together.":"AI \uB3C4\uAD6C\uB97C \uC368\uBCF4\uB294 \uB370\uC11C, \uD568\uAED8 \uC791\uB3D9\uD558\uAC8C \uB9CC\uB4DC\uB294 \uC77C\uB85C.","Why I build, how I learn and the questions I want to work on next.":"\uC65C \uB9CC\uB4E4\uACE0, \uC5B4\uB5BB\uAC8C \uBC30\uC6B0\uBA70, \uC55E\uC73C\uB85C \uC5B4\uB5A4 \uBB38\uC81C\uB97C \uD480\uACE0 \uC2F6\uC740\uC9C0 \uB3CC\uC544\uBD24\uC2B5\uB2C8\uB2E4.","Building is how I learn.":"\uB9CC\uB4E4\uC5B4 \uBCF4\uBA70 \uBC30\uC6C1\uB2C8\uB2E4.","Competitions are a way for me to learn by building. I want to see what AI can actually do and how other people use it. Participating, trying ideas and making something are part of how I study.":"\uB300\uD68C\uB294 \uC9C1\uC811 \uB9CC\uB4E4\uC5B4 \uBCF4\uBA70 \uBC30\uC6B0\uB294 \uC790\uB9AC\uC600\uC2B5\uB2C8\uB2E4. AI\uB85C \uC2E4\uC81C \uC5B4\uB290 \uC815\uB3C4\uC758 \uACB0\uACFC\uB97C \uB0BC \uC218 \uC788\uB294\uC9C0, \uB2E4\uB978 \uC0AC\uB78C\uB4E4\uC740 \uC5B4\uB5BB\uAC8C \uD65C\uC6A9\uD558\uB294\uC9C0 \uC54C\uACE0 \uC2F6\uC5C8\uC2B5\uB2C8\uB2E4. \uCC38\uAC00\uD558\uACE0 \uC544\uC774\uB514\uC5B4\uB97C \uC2DC\uB3C4\uD558\uACE0 \uACB0\uACFC\uBB3C\uC744 \uB9CC\uB4DC\uB294 \uACFC\uC815 \uC790\uCCB4\uAC00 \uACF5\uBD80\uC600\uC2B5\uB2C8\uB2E4.","Connecting tools is the question.":"\uBAA8\uB378\uACFC \uB3C4\uAD6C\uB97C \uC5B4\uB5BB\uAC8C \uC5F0\uACB0\uD560\uC9C0 \uACE0\uBBFC\uD569\uB2C8\uB2E4.","My interest is shifting from using a single model to connecting models, tools and agents. Pointsman is part of that exploration. I am also interested in reducing the setup and connection work that makes useful plugins hard to bring into everyday tasks.":"\uAC1C\uBCC4 \uBAA8\uB378\uC744 \uC4F0\uB294 \uAC83\uC5D0\uC11C \uBAA8\uB378\xB7\uB3C4\uAD6C\xB7\uC5D0\uC774\uC804\uD2B8\uAC00 \uD568\uAED8 \uC77C\uD558\uB294 \uAD6C\uC870\uB85C \uAD00\uC2EC\uC774 \uB113\uC5B4\uC9C0\uACE0 \uC788\uC2B5\uB2C8\uB2E4. Pointsman\uB3C4 \uADF8 \uACFC\uC815\uC5D0 \uC788\uC2B5\uB2C8\uB2E4. \uC88B\uC740 \uD50C\uB7EC\uADF8\uC778\uC744 \uCC3E\uC740 \uB4A4 \uC124\uC815\uD558\uACE0 \uC790\uAE30 \uC77C\uC5D0 \uC5F0\uACB0\uD558\uB294 \uC5B4\uB824\uC6C0\uC744 \uC904\uC774\uB294 \uB370\uC5D0\uB3C4 \uAD00\uC2EC\uC774 \uC788\uC2B5\uB2C8\uB2E4.","Questions before confidence.":"\uC9C8\uBB38\uD558\uBA70 \uAD6C\uC870\uB97C \uC774\uD574\uD569\uB2C8\uB2E4.","I start by asking why a system behaves the way it does and why another approach would not work. That can make the beginning slow. Once I understand the structure, I feel more confident about moving forward. I still need to turn that confidence into evidence that other people can inspect.":"\uCC98\uC74C\uC5D0\uB294 \uC65C \uADF8\uB807\uAC8C \uB3D9\uC791\uD558\uB294\uC9C0, \uB2E4\uB978 \uBC29\uC2DD\uC73C\uB85C \uD558\uBA74 \uC65C \uC548 \uB418\uB294\uC9C0 \uC9C8\uBB38\uC774 \uB9CE\uC2B5\uB2C8\uB2E4. \uADF8\uB798\uC11C \uCD08\uBC18\uC5D0\uB294 \uC2DC\uAC04\uC774 \uAC78\uB9AC\uB294 \uD3B8\uC785\uB2C8\uB2E4. \uAD6C\uC870\uB97C \uC774\uD574\uD558\uACE0 \uB098\uBA74 \uC55E\uC73C\uB85C \uB098\uC544\uAC08 \uC790\uC2E0\uAC10\uC774 \uC0DD\uAE41\uB2C8\uB2E4. \uADF8 \uC790\uC2E0\uAC10\uC744 \uB2E4\uB978 \uC0AC\uB78C\uB3C4 \uD655\uC778\uD560 \uC218 \uC788\uB294 \uACBD\uD5D8\uACFC \uADFC\uAC70\uB85C \uC124\uBA85\uD558\uB294 \uC77C\uC740 \uB354 \uC815\uB9AC\uD574\uC57C \uD560 \uACFC\uC81C\uC785\uB2C8\uB2E4.","Turning exploration into depth.":"\uB113\uC740 \uD0D0\uC0C9\uC744 \uAE4A\uC774 \uC788\uB294 \uACBD\uD5D8\uC73C\uB85C \uC774\uC5B4\uAC00\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.","I want to connect this exploration to real industry problems and learn how AI is used in practice. My open question is how to balance trying new tools with building depth in a field. I am looking for a team where I can keep building, questioning and learning.":"\uC9C0\uAE08\uC758 \uD0D0\uC0C9\uC744 \uC2E4\uC81C \uC0B0\uC5C5\uC758 \uBB38\uC81C\uC640 \uC5F0\uACB0\uD558\uACE0, \uD604\uC7A5\uC5D0\uC11C AI\uAC00 \uC5B4\uB5BB\uAC8C \uC4F0\uC774\uB294\uC9C0 \uBC30\uC6B0\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4. \uC0C8\uB85C\uC6B4 \uB3C4\uAD6C\uB97C \uC2DC\uB3C4\uD558\uB294 \uC77C\uACFC \uD55C \uBD84\uC57C\uC758 \uAE4A\uC774\uB97C \uC313\uB294 \uC77C \uC0AC\uC774\uC5D0\uC11C \uC5B4\uB5A4 \uADE0\uD615\uC744 \uC7A1\uC744\uC9C0\uB294 \uC544\uC9C1 \uACE0\uBBFC\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uACC4\uC18D \uB9CC\uB4E4\uACE0 \uC9C8\uBB38\uD558\uACE0 \uBC30\uC6B8 \uC218 \uC788\uB294 \uD300\uC5D0\uC11C \uC77C\uD558\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.","Adapted from my personal reflection, written on 25 October 2026.":"2026\uB144 10\uC6D4 25\uC77C\uC5D0 \uB0A8\uAE34 \uAC1C\uC778 \uD68C\uACE0\uB97C \uBC14\uD0D5\uC73C\uB85C \uC815\uB9AC\uD588\uC2B5\uB2C8\uB2E4.","Lessons from my projects":"\uD504\uB85C\uC81D\uD2B8\uC5D0\uC11C \uBC30\uC6B4 \uC810","Explore my work":"\uD504\uB85C\uC81D\uD2B8 \uBCF4\uAE30","View GitHub":"GitHub \uBCF4\uAE30","Career at a glance":"\uC8FC\uC694 \uC774\uB825",PROFESSIONAL:"\uC2E4\uBB34 \uACBD\uD5D8","Backend & QA \xB7 2023\u20132024":"\uBC31\uC5D4\uB4DC \xB7 QA / 2023\u20132024",EDUCATION:"\uD559\uB825","Sungkyunkwan University":"\uC131\uADE0\uAD00\uB300\uD559\uAD50","Software \xB7 Expected Feb 2027":"\uC18C\uD504\uD2B8\uC6E8\uC5B4\uD559\uACFC \xB7 2027.02 \uC878\uC5C5\uC608\uC815","SERVICE & LEADERSHIP":"\uAD70 \uBCF5\uBB34 \xB7 \uB9AC\uB354\uC2ED","Republic of Korea Army":"\uB300\uD55C\uBBFC\uAD6D \uC721\uAD70","Satellite communications \xB7 2024\u20132025":"\uC704\uC131\uD1B5\uC2E0 y:"A shared home for Claude Code and Codex plugins, skills, hooks and MCP settings, with a staged move from Python and bash to Go.",tags:["Developer tools","Go migration","Configuration"],problem:"Useful agent tools still take work to discover, configure and keep consistent across environments. The management commands also had startup overhead.",decision:"I chose a staged Go migration for speed and functionality, with existing OS tools used where appropriate and Windows treated as a separate target. Agents implemented and tested the changes.",result:"The recorded first-stage benchmark for sync --check moved from a 1,904 ms median to 268 ms, with 8 runs per version in an isolated setup. This check path still called Python; it was not a complete migration or a cross-platform runtime result.",role:"I set the migration direction and scope, then asked coding agents to implement and test the changes.",url:"",linkLabel:""},{id:"pointsman",name:"Pointsman",category:"Agents",label:"Public project \xB7 ongoing research",title:"Routing agent work with Jev and dependency DAGs.",summary:"Jev turns a goal into tasks and dependencies; a DAG routes ready work to scoped coding agents and connects their outputs to checks.",tags:["Jev","Dependency DAG","Task routing"],problem:"A useful goal still leaves questions about task boundaries, dependencies and what counts as finished.",decision:"Use Jev for decomposition and dependency planning, represent the work as a directed acyclic graph, and dispatch ready tasks through a queue. Give workers an explicit scope, then check and repair their outputs.",result:"The public project and research records describe the workflow and its measured comparisons. Those comparisons apply to their recorded tasks and evaluation conditions.",role:"I set the direction, asked questions about how the workflow should operate, and reviewed results. Coding agents helped implement and test the ideas.",url:"https://github.com/Kai-Leee/pointsman",linkLabel:"View repository"},{id:"voice",name:"Generated Audio Detection",category:"Applied ML",label:"Competition experiments",title:"Finding the weak links in audio detection.",summary:"Speech and music mixtures, representation choices, preprocessing and file-level aggregation.",tags:["Audio ML","Data curation","Paired evaluation"],problem:"An audio file can mix speech, music and generated segments. A promising model does not settle how to prepare, crop or aggregate that input.",decision:"Compare stem-aware features, model representations and aggregation on matched inputs, and keep the question, configuration and result tied together.",result:"One matched file-level panel improved while a music diagnostic worsened. I kept those findings separate rather than treating an internal result as a verified competition gain.",role:"I directed data preparation and experimental choices, worked with coding agents on implementation, and reviewed the evidence behind score claims.",url:"https://github.com/Kai-Leee/competition-portfolio/blob/main/competitions/deepvoice/README.md",linkLabel:"Read case study"},{id:"disclosure",name:"Financial Disclosure Agent",category:"Agents",label:"Personal design & review notes",title:"Making financial answers easier to check.",summary:"A review of source-backed answers and the gap between a valid structure and a correct meaning.",tags:["Evidence extraction","Semantic review","Human review"],problem:"A well-formed response can still attach the wrong meaning to its evidence. Structure alone is an incomplete check.",decision:"Treat source checking and semantic review as explicit steps. An agent review does not replace a person accepting the result.",result:"The published case focuses on my design ideas and review lessons. It does not publish the team implementation or internal performance.",role:"My contribution covered design ideas and review, with a focus on whether the evidence supported the answer.",url:"https://github.com/Kai-Leee/competition-portfolio/blob/main/competitions/disclosure-agent/README.md",linkLabel:"Read review notes"},{id:"wind",name:"BARAM Wind Power",category:"Applied ML",label:"Experiment retrospective",title:"Working through a forecasting bottleneck.",summary:"Forecasting experiments with shared evaluation contracts, scoped agent work and recorded failures.",tags:["Forecasting","Experiment design","Learning from failure"],problem:"The forecasting bottleneck persisted across a long series of ideas. More runs did not automatically produce a clearer explanation.",decision:"Preserve hypotheses, configurations, ownership and verification. When progress stalled, I also sought out winning participants\u2019 approaches to expand my understanding.",result:"The record includes successful read-only verification stages and a separate failed implementation run. A final validated forecast score is not established by those checks.",role:"I made experiment choices, reviewed agent work and sought external perspectives when my own approach stopped progressing.",url:"https://github.com/Kai-Leee/competition-portfolio/blob/main/competitions/wind-power/README.md",linkLabel:"Read retrospective"},{id:"microstructure",name:"Microstructure Hardness Prediction",category:"Applied ML",label:"Competition experiments",title:"Learning what an image representation leaves out.",summary:"Image models, manual masks and grain, pore and boundary features for hardness prediction from synthetic microstructure images.",tags:["Image ML","Feature engineering","Error analysis"],problem:"A grayscale image mixed noise, pores, grains and boundaries, while the target was a single hardness value. General image features did not give the result I expected.",decision:"I spent time marking and masking images, then compared restored images, explicit structural features, tree models and CNNs. I also examined sensitivity to brightness.",result:"Some early masking work helped in my experiments, but the later development OOF comparison did not support a benefit from the added features over the existing CNN. This was a development comparison, not an independent or official score.",role:"I chose the image-analysis direction, worked on manual labels and masks, and reviewed agent-assisted experiments. Better separation of pores, grains and boundaries remains an open question.",url:"https://github.com/Kai-Leee/competition-portfolio",linkLabel:"View experiment archive"},{id:"ibk",name:"IBK Securities \xB7 Portfolio Optimization",category:"Applied ML",label:"Industry\u2013academic project \xB7 Apr\u2013Dec 2022",title:"Connecting financial data to a usable service.",summary:"Market prediction and portfolio optimization, with data collection, autoencoder-based dimensionality reduction and a deployed backend.",tags:["Autoencoder","Django","MongoDB","Docker"],problem:"A user-requested portfolio needed a path from financial data and analysis to an accessible service.",decision:"I collected data, used an autoencoder to reduce its dimensions, and worked on portfolio optimization based on user requests. I connected Django APIs to MongoDB and prepared the Docker environment and server deployment.",result:"The team delivered the service and final presentation. I contributed data processing, portfolio optimization and backend deployment.",role:"As leader of a five-person industry\u2013academic team working with IBK Securities, I coordinated the schedule and shared domain knowledge while handling data and backend work.",url:"https://github.com/ibk-project/ibk-analytical-trading",linkLabel:"View team repository"},{id:"soynet",name:"SoyNet \xB7 Model Conversion Parser",category:"Software",label:"Industry\u2013academic project \xB7 Apr 2021\u2013Feb 2022",title:"Bridging model graphs and an inference engine.",summary:"A C++ parser that maps ONNX graphs to SoyNet configuration and connects the PyTorch Mask R-CNN configuration path.",tags:["C++","ONNX","Model integration"],problem:"Model nodes and attributes needed to become parameters the inference engine could consume, without hiding conversion mistakes.",decision:"I separated mapping rules into text tables and compared the converted configuration layer by layer. I connected postprocessing and input/output settings for the PyTorch Mask R-CNN path.",result:"The work produced a configuration-generation path and corrected conversion errors through layer-level comparisons.",role:"I developed the C++ conversion parser and mapping rules as part of the industry\u2013academic project. This work predates my current agent-assisted workflow.",url:"",linkLabel:""},{id:"vessel",name:"Multilingual Vessel Matching",category:"Applied ML",label:"Competition experiments",title:"Separating missing candidates from wrong choices.",summary:"Candidate search and BGE/LoRA reranking for multilingual vessel names, explored through parallel agent experiments.",tags:["Entity matching","Reranking","Parallel experiments"],problem:"A wrong match could come from the right vessel never entering the candidate pool, or from the model choosing the wrong candidate. Those failures needed different fixes.",decision:"Compare search channels and rerankers on a shared candidate pool, keep missing-candidate errors separate, and review what information each method actually receives.",result:"The development comparison showed a small difference between string-based search and BGE reranking. The development set was reused and the reranker received more information, so this did not isolate a model-only gain or establish an independent result.",role:"I proposed ideas, designed comparisons and configured agents, skills and queues for parallel work. Coding agents implemented the candidates; I reviewed the comparisons and chose follow-up questions.",url:"https://github.com/Kai-Leee/competition-portfolio",linkLabel:"View experiment archive"}],$v=[{name:"Personal OS",summary:"A Markdown-first personal workspace with web and macOS views, backups and conflict checks. Native integration is still partial."},{
