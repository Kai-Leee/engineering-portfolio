B9CC\uB4E4\uACE0,","then test the assumptions.":"\uADF8 \uC548\uC758 \uAC00\uC815\uC744 \uAC80\uC99D\uD569\uB2C8\uB2E4.","My work spans backend engineering, QA and AI competitions. I enter competitions to see how AI performs in practice and learn from other builders. Today I am exploring how models, tools and agents can work together, and how to make that setup easier to use. I want to connect that learning to real industry problems.":"\uBC31\uC5D4\uB4DC \uAC1C\uBC1C\uACFC QA\uB97C \uACBD\uD5D8\uD588\uACE0, AI\uB97C \uC2E4\uC81C\uB85C \uC5B4\uB514\uAE4C\uC9C0 \uD65C\uC6A9\uD560 \uC218 \uC788\uB294\uC9C0 \uD655\uC778\uD558\uB824\uACE0 \uC5EC\uB7EC \uB300\uD68C\uC5D0 \uCC38\uAC00\uD588\uC2B5\uB2C8\uB2E4. \uC9C0\uAE08\uC740 \uBAA8\uB378\xB7\uB3C4\uAD6C\xB7\uC5D0\uC774\uC804\uD2B8\uAC00 \uD568\uAED8 \uC77C\uD558\uB294 \uAD6C\uC870\uC640, \uADF8 \uD658\uACBD\uC744 \uB354 \uC27D\uAC8C \uC5F0\uACB0\uD558\uB294 \uBC29\uBC95\uC744 \uD0D0\uAD6C\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uC774 \uACBD\uD5D8\uC744 \uC2E4\uC81C \uC0B0\uC5C5\uC758 \uBB38\uC81C\uB85C \uC774\uC5B4\uAC00\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.","Read my latest reflection":"\uCD5C\uADFC \uD68C\uACE0 \uC77D\uAE30","PERSONAL REFLECTION":"\uAC1C\uC778 \uD68C\uACE0","25 October 2026":"2026\uB144 10\uC6D4 25\uC77C","From trying AI tools to making them work together.":"AI \uB3C4\uAD6C\uB97C \uC368\uBCF4\uB294 \uB370\uC11C, \uD568\uAED8 \uC791\uB3D9\uD558\uAC8C \uB9CC\uB4DC\uB294 \uC77C\uB85C.","Why I build, how I learn and the questions I want to work on next.":"\uC65C \uB9CC\uB4E4\uACE0, \uC5B4\uB5BB\uAC8C \uBC30\uC6B0\uBA70, \uC55E\uC73C\uB85C \uC5B4\uB5A4 \uBB38\uC81C\uB97C \uD480\uACE0 \uC2F6\uC740\uC9C0 \uB3CC\uC544\uBD24\uC2B5\uB2C8\uB2E4.","Building is how I learn.":"\uB9CC\uB4E4\uC5B4 \uBCF4\uBA70 \uBC30\uC6C1\uB2C8\uB2E4.","Competitions are a way for me to learn by building. I want to see what AI can actually do and how other people use it. Participating, trying ideas and making something are part of how I study.":"\uB300\uD68C\uB294 \uC9C1\uC811 \uB9CC\uB4E4\uC5B4 \uBCF4\uBA70 \uBC30\uC6B0\uB294 \uC790\uB9AC\uC600\uC2B5\uB2C8\uB2E4. AI\uB85C \uC2E4\uC81C \uC5B4\uB290 \uC815\uB3C4\uC758 \uACB0\uACFC\uB97C \uB0BC \uC218 \uC788\uB294\uC9C0, \uB2E4\uB978 \uC0AC\uB78C\uB4E4\uC740 \uC5B4\uB5BB\uAC8C \uD65C\uC6A9\uD558\uB294\uC9C0 \uC54C\uACE0 \uC2F6\uC5C8\uC2B5\uB2C8\uB2E4. \uCC38\uAC00\uD558\uACE0 \uC544\uC774\uB514\uC5B4\uB97C \uC2DC\uB3C4\uD558\uACE0 \uACB0\uACFC\uBB3C\uC744 \uB9CC\uB4DC\uB294 \uACFC\uC815 \uC790\uCCB4\uAC00 \uACF5\uBD80\uC600\uC2B5\uB2C8\uB2E4.","Connecting tools is the question.":"\uBAA8\uB378\uACFC \uB3C4\uAD6C\uB97C \uC5B4\uB5BB\uAC8C \uC5F0\uACB0\uD560\uC9C0 \uACE0\uBBFC\uD569\uB2C8\uB2E4.","My interest is shifting from using a single model to connecting models, tools and agents. Pointsman is part of that exploration. I am also interested in reducing the setup and connection work that makes useful plugins hard to bring into everyday tasks.":"\uAC1C\uBCC4 \uBAA8\uB378\uC744 \uC4F0\uB294 \uAC83\uC5D0\uC11C \uBAA8\uB378\xB7\uB3C4\uAD6C\xB7\uC5D0\uC774\uC804\uD2B8\uAC00 \uD568\uAED8 \uC77C\uD558\uB294 \uAD6C\uC870\uB85C \uAD00\uC2EC\uC774 \uB113\uC5B4\uC9C0\uACE0 \uC788\uC2B5\uB2C8\uB2E4. Pointsman\uB3C4 \uADF8 \uACFC\uC815\uC5D0 \uC788\uC2B5\uB2C8\uB2E4. \uC88B\uC740 \uD50C\uB7EC\uADF8\uC778\uC744 \uCC3E\uC740 \uB4A4 \uC124\uC815\uD558\uACE0 \uC790\uAE30 \uC77C\uC5D0 \uC5F0\uACB0\uD558\uB294 \uC5B4\uB824\uC6C0\uC744 \uC904\uC774\uB294 \uB370\uC5D0\uB3C4 \uAD00\uC2EC\uC774 \uC788\uC2B5\uB2C8\uB2E4.","Questions before confidence.":"\uC9C8\uBB38\uD558\uBA70 \uAD6C\uC870\uB97C \uC774\uD574\uD569\uB2C8\uB2E4.","I start by asking why a system behaves the way it does and why another approach would not work. That can make the beginning slow. Once I understand the structure, I feel more confident about moving forward. I still need to turn that confidence into evidence that other people can inspect.":"\uCC98\uC74C\uC5D0\uB294 \uC65C \uADF8\uB807\uAC8C \uB3D9\uC791\uD558\uB294\uC9C0, \uB2E4\uB978 \uBC29\uC2DD\uC73C\uB85C \uD558\uBA74 \uC65C \uC548 \uB418\uB294\uC9C0 \uC9C8\uBB38\uC774 \uB9CE\uC2B5\uB2C8\uB2E4. \uADF8\uB798\uC11C \uCD08\uBC18\uC5D0\uB294 \uC2DC\uAC04\uC774 \uAC78\uB9AC\uB294 \uD3B8\uC785\uB2C8\uB2E4. \uAD6C\uC870\uB97C \uC774\uD574\uD558\uACE0 \uB098\uBA74 \uC55E\uC73C\uB85C \uB098\uC544\uAC08 \uC790\uC2E0\uAC10\uC774 \uC0DD\uAE41\uB2C8\uB2E4. \uADF8 \uC790\uC2E0\uAC10\uC744 \uB2E4\uB978 \uC0AC\uB78C\uB3C4 \uD655\uC778\uD560 \uC218 \uC788\uB294 \uACBD\uD5D8\uACFC \uADFC\uAC70\uB85C \uC124\uBA85\uD558\uB294 \uC77C\uC740 \uB354 \uC815\uB9AC\uD574\uC57C \uD560 \uACFC\uC81C\uC785\uB2C8\uB2E4.","Turning exploration into depth.":"\uB113\uC740 \uD0D0\uC0C9\uC744 \uAE4A\uC774 \uC788\uB294 \uACBD\uD5D8\uC73C\uB85C \uC774\uC5B4\uAC00\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.","I want to connect this exploration to real industry problems and learn how AI is used in practice. My open question is how to balance trying new tools with building depth in a field. I am looking for a team where I can keep building, questioning and learning.":"\uC9C0\uAE08\uC758 \uD0D0\uC0C9\uC744 \uC2E4\uC81C \uC0B0\uC5C5\uC758 \uBB38\uC81C\uC640 \uC5F0\uACB0\uD558\uACE0, \uD604\uC7A5\uC5D0\uC11C AI\uAC00 \uC5B4\uB5BB\uAC8C \uC4F0\uC774\uB294\uC9C0 \uBC30\uC6B0\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4. \uC0C8\uB85C\uC6B4 \uB3C4\uAD6C\uB97C \uC2DC\uB3C4\uD558\uB294 \uC77C\uACFC \uD55C \uBD84\uC57C\uC758 \uAE4A\uC774\uB97C \uC313\uB294 \uC77C \uC0AC\uC774\uC5D0\uC11C \uC5B4\uB5A4 \uADE0\uD615\uC744 \uC7A1\uC744\uC9C0\uB294 \uC544\uC9C1 \uACE0\uBBFC\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uACC4\uC18D \uB9CC\uB4E4\uACE0 \uC9C8\uBB38\uD558\uACE0 \uBC30\uC6B8 \uC218 \uC788\uB294 \uD300\uC5D0\uC11C \uC77C\uD558\uACE0 \uC2F6\uC2B5\uB2C8\uB2E4.","Adapted from my personal reflection, written on 25 October 2026.":"2026\uB144 10\uC6D4 25\uC77C\uC5D0 \uB0A8\uAE34 \uAC1C\uC778 \uD68C\uACE0\uB97C \uBC14\uD0D5\uC73C\uB85C \uC815\uB9AC\uD588\uC2B5\uB2C8\uB2E4.","Lessons from my proj
